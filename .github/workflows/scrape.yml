# 每天台灣時間 06:07 和 18:07 自動抓一次跑者廣場、運動筆記的賽事，
# 合併後有新資料就存回 output/ 資料夾。
name: 抓取賽事資料

on:
  schedule:
    - cron: "7 22 * * *"   # UTC 22:07 = 台灣 06:07
    - cron: "7 10 * * *"   # UTC 10:07 = 台灣 18:07
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 測試解析程式
        run: python -m unittest discover tests

      - name: 抓取並整理
        env:
          TZ: Asia/Taipei
        run: python run.py --out output --history history --details 20

      - name: 存回 repo
        run: |
          git config user.name "paoshi-bot"
          git config user.email "paoshi-bot@users.noreply.github.com"
          git add output/races.json output/races.csv history/ data/
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "更新賽事資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
